name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Run validation + lint suite
        run: python tools/validate.py

      - name: Test opportunity radar projection
        run: python -m unittest discover -s opportunity-radar -p 'test_*.py'

      - name: Run lint suite (independent run for clearer logs)
        run: python tools/lint.py
